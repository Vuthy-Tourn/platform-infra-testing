ARG JAVA_VERSION=__JAVA_VERSION__
ARG GRADLE_VERSION=8.10.2
ARG SERVICE_MODULE=""
ARG SERVICE_PATH="."

FROM eclipse-temurin:${JAVA_VERSION}-jdk-alpine AS builder

RUN apk add --no-cache curl unzip

RUN curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip \
    && unzip -q /tmp/gradle.zip -d /opt \
    && ln -sf "/opt/gradle-${GRADLE_VERSION}/bin/gradle" /usr/local/bin/gradle \
    && rm -f /tmp/gradle.zip

WORKDIR /app
COPY . .

RUN BUILD_TASK="bootJar"; \
    if [ -n "$SERVICE_MODULE" ]; then \
      BUILD_TASK="${SERVICE_MODULE}:bootJar"; \
    fi; \
    if [ -f gradlew ]; then \
      chmod +x gradlew; \
      ./gradlew "$BUILD_TASK" --no-daemon -x test; \
    else \
      gradle "$BUILD_TASK" --no-daemon -x test; \
    fi

RUN JAR_SOURCE_DIR="/app/build/libs"; \
    if [ "$SERVICE_PATH" != "." ] && [ -d "/app/${SERVICE_PATH}/build/libs" ]; then \
      JAR_SOURCE_DIR="/app/${SERVICE_PATH}/build/libs"; \
    fi; \
    JAR_FILE="$(find "${JAR_SOURCE_DIR}" -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | sort | head -n1)"; \
    if [ -z "$JAR_FILE" ]; then \
      echo "ERROR: Could not find built JAR in ${JAR_SOURCE_DIR}" >&2; \
      exit 1; \
    fi; \
    cp "$JAR_FILE" /tmp/app.jar

FROM eclipse-temurin:${JAVA_VERSION}-jre-alpine

WORKDIR /app

COPY --from=builder /tmp/app.jar ./app.jar

EXPOSE 8080

ENTRYPOINT ["java", "-jar", "app.jar"]
